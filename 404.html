<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>404 — Page Not Found | Tapas &amp; Co.</title>
  
  <!-- ===== FAVICON ADDED HERE ===== -->
  <link rel="icon" type="image/jpeg" href="images/hero 3.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #E8DCC8;
      --text-primary: #401C24;
      --text-secondary: #6B5E54;
      --ochre: #C58B50;
      --burgundy: #401C24;
      --wine: #722F37;
      --cream: #E8DCC8;
      
      --transition: 0.35s ease;
    }

    /* ===== DARK MODE ===== */
    [data-theme="dark"] {
      --bg-primary: #0A0A0A;
      --text-primary: #FFFFFF;
      --text-secondary: #D6D6D6;
      --cream: #E8DCC8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
      background-image: 
        linear-gradient(rgba(197, 139, 80, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(197, 139, 80, 0.08) 1px, transparent 1px);
      background-size: 80px 80px;
      padding: 2rem;
    }

    [data-theme="dark"] body {
      background-image: 
        linear-gradient(rgba(197, 139, 80, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(197, 139, 80, 0.04) 1px, transparent 1px);
    }

    .error-container {
      max-width: 680px;
      width: 100%;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .error-code {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11rem;
      font-weight: 700;
      line-height: 0.8;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.5rem;
      letter-spacing: -0.05em;
    }

    .error-code span {
      display: inline-block;
      color: transparent;
      -webkit-text-stroke: 5px var(--ochre);
      font-size: 10.5rem;
      font-style: italic;
      font-weight: 400;
      transform: translateY(4px);
    }

    [data-theme="dark"] .error-code span {
      -webkit-text-stroke: 4px var(--ochre);
    }

    .error-title {
      font-family: 'Inter', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 1.2rem;
      letter-spacing: -0.02em;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 400;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--burgundy);
      color: var(--cream);
      padding: 1.1rem 2.4rem;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: 0.3s ease;
      box-shadow: 0 10px 24px rgba(64, 28, 36, 0.2);
    }

    [data-theme="dark"] .btn-home {
      background: var(--ochre);
      color: #2A1015;
    }

    .btn-home:hover {
      background: var(--wine);
      color: var(--cream);
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(114, 47, 55, 0.3);
    }

    [data-theme="dark"] .btn-home:hover {
      background: var(--cream);
      color: var(--burgundy);
    }

    .btn-home i {
      font-size: 0.9rem;
      transition: transform 0.3s ease;
    }

    .btn-home:hover i {
      transform: translateX(-4px);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 767px) {
      .error-code {
        font-size: 7rem;
      }
      .error-code span {
        font-size: 6.5rem;
        -webkit-text-stroke: 3.5px var(--ochre);
        transform: translateY(2px);
      }
      .error-title {
        font-size: 1.5rem;
      }
      .error-desc {
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .btn-home {
        width: 100%;
        max-width: 280px;
      }
    }
    @media (max-width: 480px) {
      .error-code {
        font-size: 5rem;
        gap: 4px;
      }
      .error-code span {
        font-size: 4.6rem;
        -webkit-text-stroke: 2.5px var(--ochre);
        transform: translateY(1px);
      }
      .error-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-code">
      4<span>0</span>4
    </div>
    
    <h1 class="error-title">Looks Like This Engagement Doesn't Exist.</h1>
    
    <p class="error-desc">
      The page you're looking for has been moved, renamed, or never existed.
      Don't worry — we can get you back on track. Let's head home and find what you need.
    </p>
    
    <a href="index.html" class="btn-home">
      <i class="fas fa-arrow-left"></i> Back To Home
    </a>
  </div>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('tapas-theme');
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</body>
</html>
